name: CI

on:
  push:
  pull_request:

jobs:
  # The reference interpreter: the desktop toolchain and the full test suite
  # (including the golden corpus, which freezes the semantics), plus a smoke
  # of the CLI pipeline over the examples.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DIPROP_SFML=OFF -DIPROP_GODOT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke the CLI pipeline
        run: cmake -DTOOLS=${{ github.workspace }}/build/tools -P scripts/cli_smoke.cmake

  # The HTML5/WASM backend: the same interpreter compiled to WebAssembly,
  # checked against fresh desktop renders, structured outputs and the
  # frozen golden images as well as the shared in-browser hash suite.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DIPROP_SFML=OFF -DIPROP_GODOT=OFF

      - name: Build (native tools for asset preparation and comparison)
        run: cmake --build build --parallel --target ipa ipc ipgen

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10

      - name: Build the WASM module
        run: |
          mkdir -p build/wasm && cd build/wasm
          emcmake cmake ../../backends/html5 -DCMAKE_BUILD_TYPE=Release
          emmake make -j4

      - name: Conformance (WASM vs native pixels, outputs and golden hashes)
        run: |
          sh backends/html5/prepare.sh
          node --test backends/html5/test/*.test.js
          node backends/html5/test/run-tests.js build/wasm

  native-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxcursor-dev libudev-dev libfreetype-dev libharfbuzz-dev libgl1-mesa-dev xvfb
      - name: Pinned SFML and Godot bindings
        run: |
          git clone --depth 1 --branch 3.1.0 https://github.com/SFML/SFML.git .deps/SFML
          cmake -S .deps/SFML -B .deps/sfml-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/.deps/sfml" -DBUILD_SHARED_LIBS=OFF -DSFML_BUILD_AUDIO=OFF -DSFML_BUILD_NETWORK=OFF
          cmake --build .deps/sfml-build --parallel 4
          cmake --install .deps/sfml-build
          git clone --depth 1 --branch godot-4.5-stable https://github.com/godotengine/godot-cpp.git .deps/godot-cpp
          curl -fL https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o .deps/godot.zip
          unzip .deps/godot.zip -d .deps
          chmod +x .deps/Godot_v4.5.2-stable_linux.x86_64
      - name: Require both integrations
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DIPROP_SFML=ON -DIPROP_SFML_PREFIX="$PWD/.deps/sfml" -DSFML_STATIC_LIBRARIES=ON
          -DIPROP_GODOT=ON -DIPROP_GODOTCPP_DIR="$PWD/.deps/godot-cpp"
          -DGODOTCPP_BUILD_PROFILE="$PWD/backends/godot/build_profile.json"
          -DIPROP_GODOT_BINARY="$PWD/.deps/Godot_v4.5.2-stable_linux.x86_64"
      - name: Build and test real rendering and lifecycle
        run: |
          cmake --build build --parallel 4
          xvfb-run -a ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DIPROP_SFML=OFF -DIPROP_GODOT=OFF
          '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined,float-cast-overflow -fno-omit-frame-pointer -fno-sanitize-recover=all'
          '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all'
      - name: Build and test all compiler and VM regressions
        run: |
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
