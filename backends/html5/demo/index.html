<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iprop — HTML5 backend demo</title>
<style>
  body { font-family: system-ui, sans-serif; background: #141d27; color: #dce4ea; margin: 2rem; }
  h1 { font-size: 1.2rem; }
  .grid { display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start; }
  .cell { text-align: center; }
  canvas { image-rendering: pixelated; background: #0c1218; border: 1px solid #314952; }
  .label { margin-top: 0.4rem; font-size: 0.85rem; color: #8aa4ae; }
  #status { margin-bottom: 1rem; color: #90c5b9; }
  #status.error { color: #e0a14a; }
</style>
</head>
<body>
<h1>iprop — HTML5/WASM demo (reference interpreter in your browser)</h1>
<div id="status">loading…</div>
<div class="grid">
  <div class="cell">
    <canvas id="portrait" width="64" height="64"></canvas>
    <div class="label">portrait — a 5×5 sheet of identities (seeds 0–24),<br>pixel-identical to the desktop sheet</div>
  </div>
  <div class="cell">
    <canvas id="noise" width="64" height="64"></canvas>
    <div class="label">noise — a per-pixel value-noise field</div>
  </div>
  <div class="cell">
    <canvas id="shapes" width="64" height="64"></canvas>
    <div class="label">shapes — canvas primitives and blending</div>
  </div>
</div>
<script src="../iprop.js"></script>
<script src="../js/api.js"></script>
<script>
async function loadBytes(name) {
  const response = await fetch(name);
  if (!response.ok) { throw new Error("cannot fetch " + name); }
  return new Uint8Array(await response.arrayBuffer());
}

function status(text, isError) {
  const node = document.getElementById("status");
  node.textContent = text;
  node.className = isError ? "error" : "";
}

// Renders a variant sheet of one asset: a grid of seeds into a canvas.
async function renderSheet(iprop, canvasId, file, columns, seeds) {
  const bytes = await loadBytes(file);
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");
  const cell = 64;
  canvas.width = columns * cell;
  canvas.height = Math.ceil(seeds / columns) * cell;
  for (let seed = 0; seed < seeds; ++seed) {
    const result = iprop.generate(bytes, { seed: seed });
    const image = new ImageData(
      new Uint8ClampedArray(result.data.buffer, result.data.byteOffset, result.data.byteLength),
      result.width, result.height);
    const x = (seed % columns) * cell;
    const y = Math.floor(seed / columns) * cell;
    // Stash each frame in its own offscreen canvas for putImageData.
    const off = document.createElement("canvas");
    off.width = result.width;
    off.height = result.height;
    off.getContext("2d").putImageData(image, 0, 0);
    ctx.drawImage(off, x, y, cell, cell);
  }
}

async function main() {
  try {
    const iprop = await Iprop.create("iprop.wasm");
    status("running…");
    await renderSheet(iprop, "portrait", "portrait.iprop", 5, 25);
    await renderSheet(iprop, "noise", "noise.iprop", 1, 1);
    await renderSheet(iprop, "shapes", "shapes.iprop", 1, 1);
    status("done — every frame was generated by the WASM interpreter, byte for byte the desktop output.");
  } catch (error) {
    status("error: " + error, true);
  }
}

main();
</script>
</body>
</html>
