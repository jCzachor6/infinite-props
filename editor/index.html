<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iprop studio</title>
<style>
  :root {
    --bg: #10161d;
    --panel: #17212b;
    --line: #2b3a46;
    --text: #dce4ea;
    --dim: #8aa4ae;
    --accent: #90c5b9;
    --warn: #e0a14a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.45rem 0.9rem;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    font-size: 0.82rem;
  }
  #toolbar .title { color: var(--accent); font-weight: 600; }
  #toolbar .dir { color: var(--dim); }
  #toolbar button {
    font: inherit;
    font-size: 0.78rem;
    color: #0c1218;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    padding: 0.3rem 0.8rem;
    cursor: pointer;
  }
  #toolbar button:hover { filter: brightness(1.12); }
  #toolbar .spacer { flex: 1; }
  #status { color: var(--dim); font-size: 0.78rem; }
  #status.error { color: var(--warn); }
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 13rem;
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    font-size: 0.8rem;
  }
  #sidebar h2 {
    font-size: 0.72rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0.8rem 0.8rem 0.4rem;
  }
  #files { flex: 1; overflow-y: auto; }
  .file {
    padding: 0.3rem 0.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    white-space: nowrap;
  }
  .file:hover { background: #1d2a35; }
  .file.active { background: #22343f; color: var(--accent); }
  .file .entry-badge { color: var(--warn); font-size: 0.7rem; }
  #sidebar .footer { padding: 0.5rem 0.8rem; border-top: 1px solid var(--line); color: var(--dim); font-size: 0.72rem; }
  #workspace { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
    background: #141d26;
    font-size: 0.78rem;
    overflow-x: auto;
  }
  .tab {
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    border-right: 1px solid var(--line);
    color: var(--dim);
    white-space: nowrap;
  }
  .tab.active { color: var(--text); background: var(--bg); border-bottom: 2px solid var(--accent); }
  .tab .dirty { color: var(--warn); }
  #editor { flex: 1; min-height: 0; overflow: hidden; }
  #editor .cm-editor { height: 100%; }
  #terminal-wrap { border-top: 1px solid var(--line); background: #0a0f14; }
  #terminal-bar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.25rem 0.6rem;
    font-size: 0.72rem;
    color: var(--dim);
    background: var(--panel);
    cursor: pointer;
  }
  #terminal { height: 14rem; padding: 0.35rem 0.6rem; }
  #terminal.hidden { display: none; }
  .xterm .xterm-viewport { background: transparent; }
  #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 0.85rem; }
</style>
</head>
<body>
  <div id="toolbar">
    <span class="title">iprop studio</span>
    <span class="dir" id="dir">no project</span>
    <span class="spacer"></span>
    <button id="open">Open folder</button>
    <button id="compile">Compile</button>
    <span id="status"></span>
  </div>
  <div id="main">
    <div id="sidebar">
      <h2>project</h2>
      <div id="files"></div>
      <div class="footer">✦ = entry · run your agents in the terminal below</div>
    </div>
    <div id="workspace">
      <div id="tabs"></div>
      <div id="editor"></div>
      <div id="empty">open a folder to start editing .ips files</div>
      <div id="terminal-wrap">
        <div id="terminal-bar"><span id="terminal-toggle">▸ terminal</span><span id="terminal-hint">run opencode / codex / copilot here</span></div>
        <div id="terminal" class="hidden"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
